[package]
name = "soroban-sas-sdk-mock"
version = "0.1.0"
edition = "2021"
description = "Mock SAS client for contract integration unit tests"
license = "Apache-2.0"
repository = "https://github.com/soroban-sas/soroban-sas"
publish = false

[deps]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-sas-common = { workspace = true }

[features]
default = []
testutils = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
